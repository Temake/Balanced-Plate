name: Build, Push & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          REGISTRY_IMAGE="${{ env.REGISTRY }}/${OWNER}/${REPO}"

          echo "registry_image=${REGISTRY_IMAGE}" >> "$GITHUB_OUTPUT"

          IMAGE_TAG="${{ github.sha }}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          IMAGE="${REGISTRY_IMAGE}:${IMAGE_TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          IMAGE_LATEST="${REGISTRY_IMAGE}:latest"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

          echo "Building image: ${IMAGE}"
          echo "Latest image: ${IMAGE_LATEST}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true

          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: false

      - name: Image digest
        run: |
          echo "Successfully pushed:"
          echo "${{ steps.meta.outputs.image }}"
          echo "${{ steps.meta.outputs.image_latest }}"

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate production environment file
        run: |
          cat <<'EOF' > .env.production
          DEBUG=${{ secrets.DEBUG }}
          PRODUCTION=${{ secrets.PRODUCTION }}
          DJANGO_SETTINGS_MODULE=${{ secrets.DJANGO_SETTINGS_MODULE }}
          USING_MANAGED_STORAGE=${{ secrets.USING_MANAGED_STORAGE }}
          USE_DOCS=${{ secrets.USE_DOCS }}
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}

          POSTGRES_NAME=${{ secrets.POSTGRES_NAME }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}

          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          CELERY_BROKER=${{ secrets.CELERY_BROKER }}
          CELERY_BACKEND=${{ secrets.CELERY_BACKEND }}

          CORS_ALLOW_ALL_ORIGINS=${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
          DJANGO_CORS_ALLOWED_ORIGINS=${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}

          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}

          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

          DJANGO_AWS_SECRET_ACCESS_KEY=${{ secrets.DJANGO_AWS_SECRET_ACCESS_KEY }}
          DJANGO_AWS_ACCESS_KEY_ID=${{ secrets.DJANGO_AWS_ACCESS_KEY_ID }}
          DJANGO_AWS_STORAGE_BUCKET_NAME=${{ secrets.DJANGO_AWS_STORAGE_BUCKET_NAME }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          DJANGO_AWS_S3_REGION_NAME=${{ secrets.DJANGO_AWS_S3_REGION_NAME }}

          CI_REGISTRY_IMAGE=${{ secrets.CI_REGISTRY_IMAGE }}

          EOF

      - name: Upload env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: ".env.production"
          target: "/home/deploy/Balanced-Plate/backend"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            su - deploy <<EOF
            set -euo pipefail

            cd ~/Balanced-Plate

            git fetch origin main

            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

            if [ "$CURRENT_BRANCH" != "main" ]; then
              git checkout main
            fi

            git pull --ff-only

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            cd backend

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f

            echo "Deployment completed successfully."
            EOF