<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriLens</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1e293b;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: #f8fafc; margin: 0; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; background-color: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
            
            <!-- Brand Header -->
            <tr>
              <td align="center" style="padding: 28px 32px 20px 32px; border-bottom: 1px solid #f1f5f9;">
                <table cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px;">
                      🥗 Nutri<span style="color: #059669;">Lens</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Main Content Area -->
            <tr>
              <td align="left" style="padding: 32px; font-size: 15px; line-height: 1.6; color: #334155;">
                <h1 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 16px 0; line-height: 1.3;">
                  {{ subject }}
                </h1>
                
                <p style="font-size: 15px; margin: 0 0 16px 0; color: #334155;">
                  Hi {{ name | default:"there" }},
                </p>

                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Email Footer Info -->
            <tr>
              <td align="center" style="padding: 20px 32px; background-color: #f8fafc; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b; line-height: 1.5;">
                <p style="margin: 0 0 4px 0;">
                  This is an automated message from <strong>NutriLens AI</strong>.
                </p>
                <p style="margin: 0;">
                  © NutriLens AI {% now "Y" %} • Helping you make better daily food choices.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
